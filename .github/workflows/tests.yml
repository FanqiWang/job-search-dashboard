name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard logic (Node, no dependencies)
        run: node --test "tests/js/*.test.js"
      - name: Sync scripts (Python, standard library only)
        run: python -m unittest discover -s workflow/dashboard-sync/tests -v
